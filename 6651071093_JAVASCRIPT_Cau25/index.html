<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu 25 - Thực đơn</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <div class="menu-box">
        <h2>THỰC ĐƠN</h2>
        <div class="chon">
            <div>
                <h3>Thức ăn</h3>
                <select id="thucAn" multiple>
                    <option value="20000">Bún bò</option>
                    <option value="18000">Hủ tiếu</option>
                    <option value="17000">Bánh canh</option>
                    <option value="19000">Phở bò</option>
                    <option value="15000">Nuôi</option>
                    <option value="12000">Bánh mì thịt</option>
                    <option value="15000">Bánh cuốn</option>
                </select>
            </div>
            <div>
                <h3>Nước uống</h3>
                <select id="nuocUong" multiple>
                    <option value="12000">Cà phê đá</option>
                    <option value="15000">Cà phê sữa đá</option>
                    <option value="13000">Chanh dây</option>
                    <option value="12000">Chanh muối</option>
                    <option value="14000">Xí muội</option>
                    <option value="13000">Sữa tươi</option>
                    <option value="17000">Cam vắt</option>
                </select>
            </div>
            <div class="thoi-diem">
                <h3>Thời điểm</h3>
                <label><input type="radio" name="thoiDiem" value="ngay" checked> Ban ngày</label>
                <label><input type="radio" name="thoiDiem" value="dem"> Ban đêm</label>
            </div>
        </div>
        <button class="tinh" onclick="tinhTien()">Tính tiền</button>

        <table id="ketqua">
            <thead>
                <tr><th>Các món đã dùng</th><th>Tiền</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="Scripts/script.js"></script>
</body>
</html>
